<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0a0a0a;--surface:#171717;--surface2:#262626;--border:#262626;--border2:#404040;--text:#f5f5f5;--text2:#d4d4d4;--muted:#a3a3a3;--dim:#737373;--red:#dc2626;--red2:#ef4444;--redl:#f87171;--green:#16a34a;--green2:#22c55e}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:disabled{opacity:.4;cursor:not-allowed}
svg{flex-shrink:0}
.wrap{max-width:1152px;margin:0 auto;padding:24px 16px 64px}

/* Cabeçalho */
.header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:88px;height:88px;border-radius:50%;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.tagline{max-width:320px;color:var(--muted)}
.insta{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:var(--text2);font-weight:500;text-decoration:none}
.insta:hover{color:var(--redl)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.iconbtn{position:relative;border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text2);display:inline-flex}
.iconbtn:hover{background:var(--surface)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip-op{background:rgba(239,68,68,.1);color:var(--redl);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;text-decoration:none;border:1px solid transparent;white-space:nowrap}
.btn.primary,.btn.dsolid{background:var(--red);color:#fff}
.btn.primary:hover:not(:disabled),.btn.dsolid:hover{background:var(--red2)}
.btn.outline{border-color:var(--border2);color:var(--text2)}
.btn.outline:hover{background:var(--surface2)}
.btn.danger{border-color:#7f1d1d;color:var(--redl)}
.btn.danger:hover{background:rgba(127,29,29,.3)}
.btn.wa{background:var(--green);color:#fff}
.btn.wa:hover{background:var(--green2)}
.btn.sm{padding:6px 10px;font-size:12px}
.grow{flex:1}

/* Avisos */
.banner{display:flex;gap:8px;align-items:center;border:1px solid #7f1d1d;background:rgba(69,10,10,.6);color:#fca5a5;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:16px}

/* Busca e categorias */
.toolbar{margin-bottom:24px}
.search{position:relative;max-width:320px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.search input{width:100%;padding:8px 12px 8px 36px;background:var(--surface);border:1px solid var(--border);border-radius:8px;outline:0}
.search input:focus,.input:focus{border-color:var(--red)}
.search input::placeholder,.input::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:12px}
.chip{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--surface);color:var(--text2);font-weight:500}
.chip:hover{background:var(--surface2)}
.chip.active{background:var(--red);color:#fff}

/* Produtos */
.group{margin-bottom:32px}
.gtitle{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:600;border-left:2px solid var(--red);padding-left:10px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.thumb{height:144px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:#525252}
.thumb img{width:100%;height:100%;object-fit:cover}
.cbody{display:flex;flex-direction:column;gap:8px;padding:14px;flex:1}
.cbody h3{font-size:14px;font-weight:500;line-height:1.35}
.price{font-size:18px;font-weight:600;color:var(--redl)}
.stock{font-size:12px;color:var(--dim)}
.stock.low{color:var(--redl)}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.size{border:1px solid var(--border2);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:500;color:var(--text2)}
.size:hover:not(:disabled){background:var(--surface2)}
.size.active{background:var(--red);border-color:var(--red);color:#fff}
.warn{font-size:12px;color:var(--redl);margin-top:4px}
.buyrow{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px}
.stepper button{padding:6px;color:var(--text2);display:inline-flex}
.stepper button:hover:not(:disabled){background:var(--surface2)}
.stepper span{min-width:24px;text-align:center}
.soldout{flex:1;text-align:center;background:var(--surface2);color:var(--dim);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:500}
.adminrow{display:flex;gap:8px;border-top:1px solid var(--border);padding-top:10px}
.empty{border:1px dashed var(--border);border-radius:12px;padding:64px 16px;text-align:center;color:var(--dim)}
.empty svg{margin:0 auto 8px;display:block;color:#404040}

/* Janelas (modais) */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{display:flex;flex-direction:column;max-height:88vh;max-height:88dvh;width:100%;max-width:384px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,.5)}
.modal.wide{max-width:512px}
.mhead{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.mhead h2{font-size:16px;font-weight:600}
.mbody{flex:1;min-height:0;overflow-y:auto;padding:16px 20px}
.x{border-radius:50%;padding:4px;color:var(--dim);display:inline-flex}
.x:hover{background:var(--surface2);color:var(--text)}

/* Formulários */
.stack{display:flex;flex-direction:column;gap:12px}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;outline:0;color:var(--text)}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
.err,.ok{font-size:12px;color:var(--redl)}
.ok{color:#4ade80}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.topline,.sect{border-top:1px solid var(--border);padding-top:12px}
input[type=file]{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;color:var(--muted);font-size:13px}
input[type=file]::file-selector-button{margin-right:12px;border:0;border-radius:6px;background:var(--red);color:#fff;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer}
.preview{width:112px;height:112px;object-fit:cover;border-radius:8px;display:block;margin-bottom:8px}
.link{font-size:12px;color:var(--dim);margin-bottom:8px;display:block}
.link:hover{color:var(--redl)}

/* Carrinho */
.cartlist{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.cartitem{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:12px}
.iname{font-size:14px;font-weight:500}
.small{font-size:12px;color:var(--dim)}
.sub{min-width:80px;text-align:right;font-weight:500;color:var(--redl)}
.totalrow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:12px;margin-bottom:12px}
.totalrow strong{font-size:18px;color:var(--redl)}
.muted-center{text-align:center;color:var(--dim);padding:24px 0}
@media(max-width:480px){.cartitem{flex-wrap:wrap}}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);padding:8px 16px;border-radius:999px;font-size:13px;z-index:60}
</style>
</head>

<div class="wrap">
  <header id="header" class="header"></header>
  <div id="banner"></div>
  <div id="toolbar" class="toolbar"></div>
  <main id="list"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

function persist(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); setBanner(''); return true; }
  catch (e) { setBanner('Não foi possível salvar. O armazenamento do navegador pode estar cheio (tente fotos menores).'); return false; }

function load() {
  try {

  } catch (e) { products = JSON.parse(JSON.stringify(SEED)); }
  try {
    var s = localStorage.getItem(SKEY);
    if (s) { var saved = JSON.parse(s); for (var k in saved) settings[k] = saved[k]; }
  } catch (e) {}
  if (!Array.isArray(settings.categories) || !settings.categories.length) settings.categories = DEFAULT_CATEGORIES.slice();

    (out ? '<span class="soldout">Esgotado</span>' : '<button class="btn primary grow" data-action="add-cart" data-id="' + p.id + '">' + icon('cart', 14) + ' Adicionar</button>') +

function refreshCard(id) {

function renderList() {
  var q = ui.search.trim().toLowerCase(), groups;
  if (ui.active === 'Todos') {
    var orphans = [];

    });

function addToCart(p) {
  var needs = Array.isArray(p.sizes) && p.sizes.length > 0, size = ui.sizes[p.id] || '';
  if (needs && !size) { ui.sizeWarn = p.id; refreshCard(p.id); return; }
  var qty = getQty(p);
  var ex = ui.cart.find(function (i) { return i.productId === p.id && i.size === size; });
  if (ex) ex.qty = Math.min(ex.qty + qty, Math.max(p.stock, 1));
  else ui.cart.push({ cartId: uid(), productId: p.id, name: p.name, price: p.price, size: size, qty: qty });
  ui.sizeWarn = '';
  renderHeader(); refreshCard(p.id); toast('Adicionado ao carrinho');
}

function handleImageFile(file) {
  if (!file) return;
  if (['image/jpeg', 'image/png'].indexOf(file.type) === -1) { setMsg('#pf-err', 'Envie um arquivo .jpg ou .png.'); return; }
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, 600 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      formImage = c.toDataURL('image/jpeg', 0.78);
      setMsg('#pf-err', ''); renderPhoto();
    };
    img.onerror = function () { setMsg('#pf-err', 'Não foi possível ler essa imagem. Tente outro arquivo.'); };
    img.src = reader.result;
  };
  reader.onerror = function () { setMsg('#pf-err', 'Não foi possível ler esse arquivo.'); };
  reader.readAsDataURL(file);
}

function saveProduct() {
  var name = $('#pf-name').value.trim(), cat = $('#pf-cat').value;
  var stock = parseInt($('#pf-stock').value, 10), price = parsePrice($('#pf-price').value);
  var sizes = $('#pf-sizes').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  if (!name) return setMsg('#pf-err', 'Digite o nome do produto.');
  if (isNaN(price) || price < 0) return setMsg('#pf-err', 'Digite um valor válido para o preço.');
  if (isNaN(stock) || stock < 0) return setMsg('#pf-err', 'Digite uma quantidade válida em estoque.');
  var data = { name: name, category: cat, price: price, stock: stock, image: formImage, sizes: sizes };
  if (editing === 'new') { data.id = uid(); products.push(data); }
  else products = products.map(function (p) { return p.id === editing ? Object.assign({}, p, data) : p; });
  persist(PKEY, products); closeModal(); renderList();
}

  var p = id ? products.find(function (x) { return x.id === id; }) : null;
  var item = id ? ui.cart.find(function (i) { return i.cartId === id; }) : null;

  switch (a) {
    case 'logo':
      if (ui.admin) break;
      logoClicks++; clearTimeout(logoTimer);
      if (logoClicks >= 5) { logoClicks = 0; openLogin(); }
      else logoTimer = setTimeout(function () { logoClicks = 0; }, 2500);
      break;
    case 'close-modal': closeModal(); break;
    case 'cat': ui.active = t.dataset.cat; renderToolbar(); renderList(); break;
    case 'size': ui.sizes[id] = t.dataset.size; ui.sizeWarn = ''; refreshCard(id); break;
    case 'qty-minus': if (p) { ui.qty[id] = Math.max(1, getQty(p) - 1); refreshCard(id); } break;
    case 'qty-plus': if (p) { ui.qty[id] = Math.min(getQty(p) + 1, Math.max(p.stock, 1)); refreshCard(id); } break;
    case 'add-cart': if (p) addToCart(p); break;
    case 'open-cart': openCart(); break;
    case 'cart-minus': if (item) { item.qty = Math.max(1, item.qty - 1); renderHeader(); openCart(); } break;
    case 'cart-plus':
      if (item) {
        var prod = products.find(function (x) { return x.id === item.productId; });
        item.qty = prod ? Math.min(item.qty + 1, Math.max(prod.stock, 1)) : item.qty + 1;
        renderHeader(); openCart();
      }
      break;
    case 'cart-remove': ui.cart = ui.cart.filter(function (i) { return i.cartId !== id; }); renderHeader(); openCart(); break;
    case 'cart-clear': ui.cart = []; renderHeader(); openCart(); break;
    case 'checkout': setTimeout(closeModal, 80); break;
    case 'do-login': doLogin(); break;
    case 'logout': ui.admin = false; renderHeader(); renderList(); break;
    case 'new-product': openProductForm('new'); break;
    case 'edit-product': openProductForm(id); break;
    case 'delete-product': openDelete(id); break;
    case 'confirm-delete':
      products = products.filter(function (x) { return x.id !== id; });
      ui.cart = ui.cart.filter(function (i) { return i.productId !== id; });
      persist(PKEY, products); closeModal(); renderHeader(); renderList();
      break;
    case 'save-product': saveProduct(); break;
    case 'remove-photo': formImage = ''; renderPhoto(); break;
    case 'open-settings': openSettings(); break;
    case 'save-settings': saveSettings(); break;
    case 'change-password': changePassword(); break;
    case 'open-categories': openCategories(); break;
    case 'cat-rename': {
      var i = +t.dataset.i, old = settings.categories[i], nn = $('#cat-' + i).value.trim();
      if (!nn || nn === old) break;
      if (settings.categories.indexOf(nn) !== -1) { openCategories('Já existe uma categoria com esse nome.'); break; }
      settings.categories[i] = nn;
      products.forEach(function (x) { if (x.category === old) x.category = nn; });
      if (ui.active === old) ui.active = nn;
      persist(SKEY, settings); persist(PKEY, products);
      openCategories(); renderToolbar(); renderList();
      break;
    }
    case 'cat-remove': {
      var j = +t.dataset.i;
      if (settings.categories.length <= 1) { openCategories('A loja precisa ter pelo menos uma categoria.'); break; }
      var removed = settings.categories.splice(j, 1)[0];
      if (ui.active === removed) ui.active = 'Todos';
      persist(SKEY, settings); openCategories(); renderToolbar(); renderList();
      break;
    }
    case 'cat-add': {
      var name = $('#cat-new').value.trim();
      if (!name) break;
      if (settings.categories.indexOf(name) !== -1) { openCategories('Já existe uma categoria com esse nome.'); break; }
      settings.categories.push(name);
      persist(SKEY, settings); openCategories(); renderToolbar(); renderList();
      break;
    }
  }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'search') { ui.search = e.target.value; renderList(); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'pf-file') handleImageFile(e.target.files && e.target.files[0]);
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'login-pass') doLogin();
  if (e.target.id === 'cat-new') {
    var btn = document.querySelector('[data-action="cat-add"]');
    if (btn) btn.click();
  }
});

load();
renderAll();
})();
</script>
</body>
</html>
